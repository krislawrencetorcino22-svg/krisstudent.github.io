<!DOCTYPE html>
<html>
<head>
    <title>Student Profile and Grading</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eaf4ff;
        }

        /* NAVIGATION */
        nav {
            background-color: #1e3a5f;
            color: white;
            padding: 15px 25px;
            display: flex;
            align-items: center;
        }

        nav h2 {
            margin: 0;
            margin-right: auto;
        }

        nav button {
            padding: 10px 18px;
            margin-left: 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        nav button:hover {
            background-color: #b9dcff;
        }

        /* PAGE */
        .page {
            padding: 40px;
        }

        .hidden {
            display: none;
        }

        /* PROFILE */
        .profile-card {
            background-color: white;
            width: 450px;
            margin: auto;
            padding: 35px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 4px 15px gray;
        }

        /* PROFILE PICTURE */
        .profile-picture {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: auto;
            overflow: hidden;
            border: 5px solid #1e73be;
            background-color: #cce5ff;
        }

        .profile-picture img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-card h1 {
            color: #1e3a5f;
        }

        .profile-card p {
            font-size: 17px;
        }

        /* UPLOAD BUTTON */
        .upload-button {
            display: inline-block;
            padding: 10px 18px;
            background-color: #1e73be;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        .upload-button:hover {
            background-color: #155a91;
        }

        #profileInput {
            display: none;
        }

        /* MAIN BUTTON */
        .main-button {
            padding: 10px 20px;
            background-color: #1e73be;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        .main-button:hover {
            background-color: #155a91;
            transform: scale(1.03);
        }

        /* GRADING */
        .grading-container {
            background-color: white;
            max-width: 850px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px gray;
        }

        .grading-container h1 {
            text-align: center;
            color: #1e3a5f;
        }

        .form-area {
            margin-top: 25px;
        }

        label {
            font-weight: bold;
        }

        input,
        select {
            padding: 10px;
            margin: 8px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        input:focus,
        select:focus {
            outline: 2px solid #1e73be;
        }

        /* TABLE */
        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th {
            background-color: #1e3a5f;
            color: white;
        }

        th,
        td {
            border: 1px solid #aaa;
            padding: 12px;
            text-align: center;
        }

        tr:hover {
            background-color: #eaf4ff;
        }

        /* MOBILE */
        @media screen and (max-width: 700px) {

            .grading-container {
                width: auto;
            }

            .profile-card {
                width: auto;
            }

            .page {
                padding: 20px;
            }

            nav {
                flex-wrap: wrap;
            }

            nav h2 {
                width: 100%;
                margin-bottom: 10px;
            }

            nav button {
                margin-left: 0;
                margin-right: 5px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <nav>

        <h2>Student System</h2>

        <button onclick="showProfile()">
            Profile
        </button>

        <button onclick="showGrading()">
            Grading
        </button>

    </nav>


    <!-- PROFILE PAGE -->
    <section id="profile" class="page">

        <div class="profile-card">

            <!-- PROFILE PICTURE -->
            <div class="profile-picture">

                <img
                    id="profileImage"
                    src=""
                    alt="Profile Picture"
                >

            </div>

            <!-- UPLOAD PROFILE -->
            <label for="profileInput" class="upload-button">
                Insert Profile Picture
            </label>

            <input
                type="file"
                id="profileInput"
                accept="image/*"
                onchange="insertProfile(event)"
            >

            <h1>Kris Lawrence Sabularse</h1>

            <p>
                <b>Course:</b>
                Bachelor of Science in Information Technology
            </p>

            <p>
                <b>Section:</b>
                BSIT 201B
            </p>

            <p>
                <b>Year Level:</b>
                2nd Year
            </p>

            <br>

            <button
                class="main-button"
                onclick="showGrading()">

                Go to Grading

            </button>

        </div>

    </section>


    <!-- GRADING PAGE -->
    <section id="grading" class="page hidden">

        <div class="grading-container">

            <h1>Grading System</h1>

            <div class="form-area">

                <!-- NAME -->

                <label>Name:</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter name"
                >

                <br>


                <!-- SUBJECT -->

                <label>Subject:</label>

                <select id="subject">

                    <option value="">
                        Select Subject
                    </option>

                    <option>
                        Principle of Communication
                    </option>

                    <option>
                        Data Structures and Algorithm
                    </option>

                    <option>
                        Reading in Philippine History
                    </option>

                    <option>
                        Platform Technology
                    </option>

                    <option>
                        P.E/PATHFIT 3: (I&DS)
                    </option>

                    <option>
                        Human-Computer Interaction
                    </option>

                    <option>
                        Rizal's Life and Works
                    </option>

                    <option>
                        Object Oriented Programming
                    </option>

                </select>

                <br>


                <!-- GRADE -->

                <label>Grade:</label>

                <select id="grade">

                    <option value="">
                        Select Grade
                    </option>

                    <option>4</option>
                    <option>3.75</option>
                    <option>3.50</option>
                    <option>3.25</option>
                    <option>3</option>
                    <option>2.75</option>
                    <option>2.50</option>
                    <option>2.25</option>
                    <option>2</option>
                    <option>1.75</option>
                    <option>1.50</option>
                    <option>1.25</option>
                    <option>1</option>

                </select>

                <br>


                <!-- BUTTONS -->

                <button
                    class="main-button"
                    onclick="saveGrade()">

                    Save

                </button>

                <button
                    class="main-button"
                    onclick="sortDescending()">

                    Descending

                </button>

            </div>


            <!-- GRADES TABLE -->

            <table id="gradeTable">

                <thead>

                    <tr>

                        <th>Name</th>
                        <th>Subject</th>
                        <th>Grade</th>

                    </tr>

                </thead>

                <tbody>
                </tbody>

            </table>

        </div>

    </section>


    <script>

        /* SHOW PROFILE */

        function showProfile() {

            document
                .getElementById("profile")
                .classList.remove("hidden");

            document
                .getElementById("grading")
                .classList.add("hidden");

        }


        /* SHOW GRADING */

        function showGrading() {

            document
                .getElementById("grading")
                .classList.remove("hidden");

            document
                .getElementById("profile")
                .classList.add("hidden");

        }


        /* INSERT PROFILE PICTURE */

        function insertProfile(event) {

            let file = event.target.files[0];

            if (file) {

                let reader = new FileReader();

                reader.onload = function(e) {

                    document
                        .getElementById("profileImage")
                        .src = e.target.result;

                    /* SAVE PROFILE PICTURE */

                    localStorage.setItem(
                        "profilePicture",
                        e.target.result
                    );

                };

                reader.readAsDataURL(file);
            }
        }


        /* LOAD PROFILE PICTURE */

        window.onload = function() {

            let savedPicture =
                localStorage.getItem("profilePicture");

            if (savedPicture) {

                document
                    .getElementById("profileImage")
                    .src = savedPicture;

            } else {

                document
                    .getElementById("profileImage")
                    .style.display = "none";

            }

        };


        /* SAVE GRADE */

        function saveGrade() {

            let name =
                document.getElementById("name").value;

            let subject =
                document.getElementById("subject").value;

            let grade =
                document.getElementById("grade").value;


            if (
                name == "" ||
                subject == "" ||
                grade == ""
            ) {

                alert("Please complete all fields.");

                return;
            }


            let table =
                document
                    .getElementById("gradeTable")
                    .getElementsByTagName("tbody")[0];


            let row = table.insertRow();


            row.insertCell(0).innerHTML = name;

            row.insertCell(1).innerHTML = subject;

            row.insertCell(2).innerHTML = grade;


            /* CLEAR INPUTS */

            document.getElementById("name").value = "";

            document.getElementById("subject").value = "";

            document.getElementById("grade").value = "";


            alert("Grade saved!");

        }


        /* DESCENDING */

        function sortDescending() {

            let table =
                document.getElementById("gradeTable");

            let rows =
                Array.from(table.tBodies[0].rows);


            rows.sort(function(a, b) {

                return Number(b.cells[2].innerText)
                     - Number(a.cells[2].innerText);

            });


            rows.forEach(function(row) {

                table.tBodies[0].appendChild(row);

            });

        }

    </script>

</body>
</html>
